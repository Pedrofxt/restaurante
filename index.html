function stepper(m, k, label) {
  const val = Number(m[k]) || 0, over = k === 'pessoas' && val > m.lugares;
  return `<div class="stepper ${over ? 'over' : ''}"><div><span>${label}</span>${over ? '<small>acima da capacidade</small>' : ''}</div>
    <div class="qty big"><button data-act="mesa-num" data-k="${k}" data-v="-1" aria-label="Diminuir ${label}">${I('minus', 14)}</button><b>${val}</b><button data-act="mesa-num" data-k="${k}" data-v="1" aria-label="Aumentar ${label}">${I('plus', 14)}</button></div></div>`;
}
const salvarMesaInfo = (() => {
  const t = {};
  return m => {
    S.pendMesa[m.id] = { lugares: m.lugares, pessoas: Number(m.pessoas) || 0, status: m.status, aberta_em: m.aberta_em };
    clearTimeout(t[m.id]);
    t[m.id] = setTimeout(async () => {
      const patch = S.pendMesa[m.id];
      try { await api.setMesaInfo(m.id, patch); } catch (e) { toast(traduz(e), 'err'); }
      if (S.pendMesa[m.id] === patch) delete S.pendMesa[m.id];
      refresh();
    }, 450);
  };
})();

/* ---------- Gaveta da mesa ---------- */
function renderDrawer() {
  const d = $('#drawer'); if (!d) return;
  if (!S.mesaId && !S.prodEdit) { document.body.classList.remove('drawer-open'); return; }
  if (S.prodEdit) syncProdForm();
  const body = d.querySelector('.d-body');
  const st = body && !S.dAnim ? body.scrollTop : 0;
  const lt = d.querySelector('.cart-lines')?.scrollTop || 0;
  d.innerHTML = S.prodEdit ? produtoFormHtml() : drawerHtml();
  const nb = d.querySelector('.d-body');
  if (nb) { nb.scrollTop = st; if (S.dAnim) nb.classList.add('enter'); }
  const nl = d.querySelector('.cart-lines'); if (nl) nl.scrollTop = lt;
  S.dAnim = false;
  requestAnimationFrame(() => document.body.classList.add('drawer-open'));
}

function drawerHtml() {
  const m = S.mesas.find(x => x.id === S.mesaId); if (!m) return '';
  const ps = pedidosDaMesa(m.id);
  return `
    <div class="d-head">
      <div><p class="eyebrow">${m.lugares} lugares${m.aberta_em ? ` · aberta há <span data-since="${m.aberta_em}">${ago(m.aberta_em)}</span>` : ''}</p><h2>Mesa ${pad(m.numero)}</h2></div>
      <button class="icon-btn" data-act="close-drawer" aria-label="Fechar">${I('x')}</button>
    </div>
    <div class="seg seg-status">${Object.entries(MESA_ST).map(([k, v]) => `<button class="${m.status === k ? 'on' : ''}" style="--c:var(--${COR_MESA[k]})" data-act="mesa-status" data-v="${k}">${v}</button>`).join('')}</div>
    <div class="mesa-info">${stepper(m, 'lugares', 'Lugares')}${stepper(m, 'pessoas', 'Pessoas na mesa')}</div>
    <div class="tabs">
      <button class="${S.aba === 'novo' ? 'on' : ''}" data-act="tab" data-v="novo">Novo pedido</button>
      <button class="${S.aba === 'comanda' ? 'on' : ''}" data-act="tab" data-v="comanda">Comanda <span class="count">${ps.length}</span></button>
      <span class="tab-ind" style="--x:${S.aba === 'novo' ? 0 : 1}"></span>
    </div>
    ${S.aba === 'novo' ? novoPedidoHtml() : comandaHtml(m, ps)}`;
}

function novoPedidoHtml() {
  const draft = getDraft();
  const disp = S.cardapio.filter(c => c.ativo);
  const cats = ['Todos', ...new Set(disp.map(c => c.categoria))];
  if (!cats.includes(S.cat)) S.cat = 'Todos';
  const items = disp.filter(c => S.cat === 'Todos' || c.categoria === S.cat);
  const total = draft.items.reduce((s, c) => s + c.qtd * c.preco, 0);
  const n = draft.items.reduce((s, c) => s + c.qtd, 0);
  return `
    <div class="d-body">
      <div class="chips cats">${cats.map(c => `<button class="chip ${S.cat === c ? 'on' : ''}" data-act="cat" data-v="${h(c)}">${h(c)}</button>`).join('')}</div>
      <div class="menu">${items.map((c, i) => {
        const q = draft.items.find(x => x.item_id === c.id)?.qtd || 0;
        return `<div class="menu-item ${q ? 'in' : ''}" style="--i:${i}">
          <div class="mi-main"><div class="thumb">${c.foto_url ? `<img src="${h(c.foto_url)}" alt="" loading="lazy">` : I('dish', 22)}</div>
          <div><strong>${h(c.nome)}</strong>${c.descricao ? `<p>${h(c.descricao)}</p>` : ''}<span class="price">${brl(c.preco)} <em class="ptime">· ${fmtPrev([c.tempo_min ?? 10, c.tempo_max ?? 20])}</em></span></div></div>
          <button class="add" data-act="add" data-v="${c.id}" aria-label="Adicionar ${h(c.nome)}">${q ? `<b>${q}</b>` : I('plus', 18)}</button>
        </div>`;
      }).join('')}</div>
    </div>
    <div class="cart">
      ${n ? `<div class="cart-lines">${draft.items.map(c => `
        <div class="line">
          <div class="qty"><button data-act="dec" data-v="${c.item_id}" aria-label="Menos">${I('minus', 14)}</button><b>${c.qtd}</b><button data-act="inc" data-v="${c.item_id}" aria-label="Mais">${I('plus', 14)}</button></div>
          <div class="line-name"><span>${h(c.nome)}</span>${c.showObs || c.obs ? `<input class="line-obs" data-obs="${c.item_id}" value="${h(c.obs)}" placeholder="Ex.: sem cebola, ao ponto…">` : ''}</div>
          <button class="icon-btn sm ${c.obs ? 'on' : ''}" data-act="note" data-v="${c.item_id}" aria-label="Observação do item">${I('note', 15)}</button>
          <span class="line-price">${brl(c.qtd * c.preco)}</span>
        </div>`).join('')}</div>
        <textarea id="obsGeral" rows="2" placeholder="Observação geral (alergias, ordem de saída, aniversário…)">${h(draft.obs)}</textarea>`
      : `<p class="cart-empty">Toque em <b>+</b> nos pratos para anotar o pedido.</p>`}
      ${n ? `<div class="prev-row">${I('clock', 13)} Previsão de preparo: <b>${fmtPrev(previsao(draft.items))}</b></div>` : ''}
      <button class="btn btn-primary btn-block" data-act="send" ${n ? '' : 'disabled'}>${I('send', 16)}<span>Enviar para a cozinha</span><span class="sp"></span><b>${n ? brl(total) : ''}</b></button>
    </div>`;
}

function comandaHtml(m, ps) {
  const pend = ps.some(p => ATIVOS.includes(p.status));
  return `
    <div class="d-body">
      ${ps.length ? ps.slice().reverse().map((p, i) => pedidoCard(p, 'comanda', i)).join('')
        : `<div class="empty">${I('receipt', 30)}<p>Nenhum pedido aberto nesta mesa.</p></div>`}
    </div>
    <div class="cart">
      <div class="total-row"><span>Total da mesa</span><strong>${brl(totalMesa(m.id))}</strong></div>
      <button class="btn ${S.confirmFechar ? 'btn-danger' : 'btn-primary'} btn-block" data-act="fechar" ${ps.length || m.status !== 'livre' ? '' : 'disabled'}>
        ${I('check', 16)}<span>${S.confirmFechar ? 'Toque de novo para confirmar' : pend ? 'Há pedidos em andamento' : 'Fechar conta e liberar mesa'}</span>
      </button>
    </div>`;
}

/* =====================================================================
   DADOS + TEMPO REAL
   ===================================================================== */
let refreshing = false, again = false, unsub = null;
async function refresh() {
  if (!S.profile) return;
  if (refreshing) { again = true; return; }
  refreshing = true;
  try {
    const d = await api.loadAll();
    d.mesas.forEach(m => { if (S.pendMesa[m.id]) Object.assign(m, S.pendMesa[m.id]); });
    notifyDiff(S.pedidos, d.pedidos);
    Object.assign(S, d);
    if (S.view === 'equipe') S.perfis = await api.listPerfis();
    renderNav();
    if (S.view !== 'perfil') renderView();
    const ae = document.activeElement;
    if (!S.prodEdit && !(ae && ae.closest('#drawer') && ae.matches('input,textarea'))) renderDrawer();
    S.firstLoad = false;
  } catch (err) { toast(traduz(err), 'err'); }
  finally { refreshing = false; if (again) { again = false; refresh(); } }
}

function notifyDiff(prev, next) {
  if (S.firstLoad) return;
  const old = new Map(prev.map(p => [p.id, p.status]));
  for (const p of next) {
    const o = old.get(p.id);
    const mesa = pad(S.mesas.find(m => m.id === p.mesa_id)?.numero ?? p.mesa_id);
    if (o === undefined && p.status === 'novo' && can('cozinha', 'admin') && p.garcom_id !== S.profile.id) {
      toast(`Novo pedido · Mesa ${mesa}`, 'warn'); chime(1);
    } else if (o && o !== p.status && p.status === 'pronto' && can('garcom', 'admin')) {
      toast(`Pedido pronto para servir · Mesa ${mesa}`, 'ok'); chime(2);
    }
  }
}

/* ---------- sessão ---------- */
let authSeq = 0;
async function setSession(session) {
  const uid = session?.user?.id || null;
  if (uid && uid === S.session?.user?.id && S.profile) { S.session = session; return; }
  const my = ++authSeq;
  S.session = session; S.profile = null;
  unsub?.(); unsub = null;
  if (!uid) { S.mesaId = null; S.pedidos = []; render(); return; }
  let prof = null;
  for (let i = 0; i < 4 && !prof; i++) { prof = await api.profile(uid).catch(() => null); if (!prof) await sleep(600); }
  if (my !== authSeq) return;
  if (!prof) { toast('Perfil não encontrado. Confira se o schema.sql foi executado no Supabase.', 'err'); await api.signOut(); return; }
  S.profile = prof; S.view = defaultView(); S.firstLoad = true; S.animate = true; S.seen.clear();
  render();
  if (S.profile.precisa_papel) return;
  await refresh();
  unsub = api.subscribe(debounce(refresh, 250));
}

/* =====================================================================
   AÇÕES
   ===================================================================== */
const ACTS = {
  'auth-mode': () => { S.authMode = S.authMode === 'login' ? 'signup' : 'login'; renderLogin(); },
  'demo-role': (v, t) => { S.demoRole = v; t.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === t)); },
  'toggle-pw': (v, t) => {
    const inp = t.parentElement.querySelector('input'); if (!inp) return;
    const show = inp.type === 'password';
    const a = inp.selectionStart, b = inp.selectionEnd;
    inp.type = show ? 'text' : 'password';
    t.setAttribute('aria-pressed', show); t.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
    t.innerHTML = I(show ? 'eyeOff' : 'eye', 18);
    inp.focus({ preventScroll: true }); try { inp.setSelectionRange(a, b); } catch {}
  },
  'signup-role': (v, t) => { S.signupRole = v; t.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === t)); },
  'escolher-papel': async v => {
    await api.escolherPapel(v);
    S.session = (await api.session()) || S.session;
    S.profile = await api.profile(S.session.user.id);
    S.view = defaultView(); S.animate = true; S.firstLoad = true;
    render(); await refresh();
    unsub ||= api.subscribe(debounce(refresh, 250));
    toast(`Tudo certo! Você entrou como ${ROLES[S.profile.papel]}.`, 'ok');
  },
  'logout-all': async () => { await api.signOutAll(); },
  'rm-avatar': async () => { await api.removeAvatar(S.profile.id, S.profile.avatar_url); await reloadProfile(); toast('Foto removida', 'ok'); },
  'novo-prod': () => {
    S.mesaId = null; S.prodFoto = null; S.confirmExcluir = false; S.dAnim = true;
    S.prodEdit = { ativo: true, categoria: S.prodCat !== 'Todos' ? S.prodCat : '', tempo_min: 10, tempo_max: 20 };
    renderDrawer(); setTimeout(() => $('#formProduto [name=nome]')?.focus({ preventScroll: true }), 450);
  },
  'edit-prod': v => { const c = S.cardapio.find(x => x.id === +v); if (!c) return; S.mesaId = null; S.prodEdit = { ...c }; S.prodFoto = null; S.confirmExcluir = false; S.dAnim = true; renderDrawer(); },
  'prod-cat': v => { S.prodCat = v; renderView(); },
  'prod-rm-foto': () => { if (S.prodFoto?.url) URL.revokeObjectURL(S.prodFoto.url); S.prodFoto = { remove: true }; renderDrawer(); },
  'prod-excluir': async () => {
    if (!S.confirmExcluir) {
      S.confirmExcluir = true; renderDrawer();
      setTimeout(() => { if (S.confirmExcluir && S.prodEdit) { S.confirmExcluir = false; renderDrawer(); } }, 4000);
      return;
    }
    const p = S.prodEdit; S.confirmExcluir = false;
    await api.excluirProduto(p);
    toast(`"${p.nome}" foi excluído do cardápio`, 'ok');
    ACTS['close-drawer'](); await refresh();
  },
  'mesa-num': (v, t) => {
    const m = S.mesas.find(x => x.id === S.mesaId); if (!m) return;
    const k = t.dataset.k, [lo, hi] = k === 'lugares' ? [1, 30] : [0, 99];
    const atual = Number(m[k]) || 0, novo = Math.min(hi, Math.max(lo, atual + Number(v)));
    if (novo === atual) return;
    m[k] = novo;
    if (k === 'pessoas' && novo > 0 && m.status === 'livre') { m.status = 'ocupada'; m.aberta_em ||= new Date().toISOString(); }
    renderDrawer(); renderView();
    salvarMesaInfo(m);
  },
  oauth: async v => { unlockAudio(); await api.oauth(v, S.demoRole); },
  logout: async () => { await api.signOut(); },
  nav: async v => {
    if (S.view === v) return;
    if (v === 'equipe') S.perfis = await api.listPerfis();
    S.view = v; S.animate = true; S.mesaId = null; S.prodEdit = null;
    transition(() => { renderNav(); renderView(); renderDrawer(); });
  },
  'open-mesa': v => { S.prodEdit = null; S.mesaId = +v; S.aba = 'novo'; S.cat = 'Todos'; S.confirmFechar = false; S.dAnim = true; renderDrawer(); },
  'close-drawer': () => { if (S.prodFoto?.url) URL.revokeObjectURL(S.prodFoto.url); S.mesaId = null; S.prodEdit = null; S.prodFoto = null; S.confirmExcluir = false; renderDrawer(); },
  tab: v => { if (S.aba === v) return; S.aba = v; S.dAnim = true; S.confirmFechar = false; renderDrawer(); },
  cat: v => { S.cat = v; S.dAnim = true; renderDrawer(); },
  filtro: v => { S.filtro = v; S.animate = true; renderView(); },
  meus: v => { S.soMeus = v === '1'; renderView(); },
  add: v => {
    const c = S.cardapio.find(x => x.id === +v); const d = getDraft();
    const l = d.items.find(x => x.item_id === c.id);
    l ? l.qtd++ : d.items.push({ item_id: c.id, nome: c.nome, preco: Number(c.preco), qtd: 1, obs: '', showObs: false });
    renderDrawer();
  },
  inc: v => { getDraft().items.find(x => x.item_id === +v).qtd++; renderDrawer(); },
  dec: v => { const d = getDraft(); const l = d.items.find(x => x.item_id === +v); if (--l.qtd <= 0) d.items.splice(d.items.indexOf(l), 1); renderDrawer(); },
  note: v => {
    const l = getDraft().items.find(x => x.item_id === +v);
    l.showObs = !l.showObs || !!l.obs; renderDrawer();
    if (l.showObs) setTimeout(() => $(`[data-obs="${v}"]`)?.focus(), 30);
  },
  send: async (v, t) => {
    const d = getDraft(); if (!d.items.length) return;
    t.disabled = true; t.classList.add('loading');
    const mesa = S.mesaId;
    try {
      await api.criarPedido(mesa, d.obs, d.items.map(c => ({ item_id: c.item_id, qtd: c.qtd, obs: c.obs })));
      delete S.drafts[mesa];
      toast(`Pedido enviado à cozinha · Mesa ${pad(mesaNum(mesa))}`, 'ok');
      S.aba = 'comanda'; S.dAnim = true;
      await refresh();
    } catch (e) { t.disabled = false; t.classList.remove('loading'); throw e; }
  },
  'mesa-status': async v => {
    const m = S.mesas.find(x => x.id === S.mesaId); if (!m || m.status === v) return;
    if (v === 'livre' && pedidosDaMesa(m.id).some(p => p.status !== 'cancelado')) return toast('Use "Fechar conta" na comanda para liberar esta mesa.', 'warn');
    await api.setStatusMesa(m, v); await refresh();
  },
  'pedido-status': async (v, t) => { t.disabled = true; await api.setStatusPedido(+t.dataset.id, v); await refresh(); },
  fechar: async () => {
    const id = S.mesaId;
    if (pedidosDaMesa(id).some(p => ATIVOS.includes(p.status))) return toast('Ainda há pedidos não entregues nesta mesa.', 'warn');
    if (!S.confirmFechar) {
      S.confirmFechar = true; renderDrawer();
      setTimeout(() => { if (S.confirmFechar && S.mesaId === id) { S.confirmFechar = false; renderDrawer(); } }, 4000);
      return;
    }
    const total = totalMesa(id);
    S.confirmFechar = false;
    await api.fecharMesa(id);
    toast(`Conta fechada · Mesa ${pad(mesaNum(id))} · ${brl(total)}`, 'ok');
    S.mesaId = null; await refresh();
  },
  'reset-demo': async () => { await api.reset?.(); S.drafts = {}; S.mesaId = null; toast('Demonstração reiniciada', 'ok'); S.animate = true; await refresh(); },
};

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  try { await ACTS[t.dataset.act]?.(t.dataset.v, t, e); }
  catch (err) { console.error(err); toast(traduz(err), 'err'); refresh(); }
});

const FORMS = {
  authForm: async (f, fd) => {
    unlockAudio();
    if (S.authMode === 'signup') {
      const r = await api.signUp(fd.get('email'), fd.get('senha'), fd.get('nome'), DEMO ? S.signupRole : S.signupRole);
      if (!DEMO && !r?.session) { toast('Conta criada! Confirme pelo link enviado ao seu e-mail.', 'ok'); S.authMode = 'login'; renderLogin(); }
    } else await api.signIn(fd.get('email'), fd.get('senha'), S.demoRole);
  },
  formNome: async (f, fd) => {
    const nome = String(fd.get('nome')).trim(); if (!nome) throw new Error('Informe seu nome.');
    await api.updateNome(S.profile.id, nome); await reloadProfile(); toast('Nome atualizado', 'ok');
  },
  formEmail: async (f, fd) => {
    await api.updateEmail(String(fd.get('email')).trim()); f.reset();
    toast(DEMO ? 'No modo demonstração o e-mail não é alterado.' : 'Enviamos um link de confirmação para o novo e-mail.', 'ok');
  },
  formSenha: async (f, fd) => {
    if (fd.get('senha') !== fd.get('conf')) throw new Error('As senhas não conferem.');
    await api.updateSenha(fd.get('senha')); f.reset();
    toast(DEMO ? 'No modo demonstração a senha não é alterada.' : 'Senha atualizada', 'ok');
  },
  formProduto: async (f, fd) => {
    const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
    const prod = {
      ...S.prodEdit,
      nome: String(fd.get('nome')).trim(), descricao: String(fd.get('descricao') || '').trim(),
      categoria: cap(String(fd.get('categoria')).trim()), preco: Number(fd.get('preco')),
      tempo_min: Math.round(Number(fd.get('tempo_min'))), tempo_max: Math.round(Number(fd.get('tempo_max'))), ativo: !!fd.get('ativo'),
    };
    if (!(prod.preco >= 0)) throw new Error('Preço inválido.');
    if (!(prod.tempo_min >= 0) || prod.tempo_max < prod.tempo_min) throw new Error('A espera máxima precisa ser maior ou igual à mínima.');
    const novo = !prod.id;
    await api.salvarProduto(prod, S.prodFoto);
    toast(novo ? `"${prod.nome}" cadastrado no cardápio` : 'Produto atualizado', 'ok');
    ACTS['close-drawer'](); S.animate = novo; await refresh();
  },
};
document.addEventListener('submit', async e => {
  const fn = FORMS[e.target.id]; if (!fn) return;
  e.preventDefault();
  const btn = e.submitter || e.target.querySelector('[type=submit]');
  btn?.classList.add('loading'); if (btn) btn.disabled = true;
  try { await fn(e.target, new FormData(e.target)); }
  catch (err) { console.error(err); toast(traduz(err), 'err'); }
  finally { if (btn?.isConnected) { btn.classList.remove('loading'); btn.disabled = false; } }
});

document.addEventListener('input', e => {
  if (e.target.matches('[data-obs]')) { const l = getDraft().items.find(x => x.item_id === +e.target.dataset.obs); if (l) l.obs = e.target.value; }
  if (e.target.id === 'obsGeral') getDraft().obs = e.target.value;
  if (e.target.id === 'prodBusca') { S.prodBusca = e.target.value; renderView(); }
});
document.addEventListener('focusout', e => {
  if (e.target.matches?.('[data-obs]')) setTimeout(() => { if (!document.activeElement?.matches('input,textarea')) renderDrawer(); }, 120);
});
document.addEventListener('change', async e => {
  const t = e.target;
  try {
    if (t.matches('[data-papel]')) {
      await api.definirPapel(t.dataset.papel, t.value); toast('Função atualizada', 'ok');
      S.perfis = await api.listPerfis(); renderView();
    } else if (t.id === 'avatarInput') {
      const f = t.files[0]; t.value = ''; if (!f) return;
      toast('Enviando foto…');
      const blob = await resizeImage(f, DEMO ? 320 : 512, true);
      await api.uploadAvatar(S.profile.id, blob, S.profile.avatar_url);
      await reloadProfile(); toast('Foto de perfil atualizada', 'ok');
    } else if (t.id === 'prodFoto') {
      const f = t.files[0]; if (!f) return;
      const blob = await resizeImage(f, DEMO ? 640 : 1200);
      if (S.prodFoto?.url) URL.revokeObjectURL(S.prodFoto.url);
      S.prodFoto = { blob, url: URL.createObjectURL(blob) }; renderDrawer();
    } else if (t.id === 'prefSom') {
      S.som = t.checked; try { localStorage.setItem('ambar-som', S.som ? '1' : '0'); } catch {}
      if (S.som) { unlockAudio(); chime(2); }
    } else if (t.matches('[data-prod-ativo]')) {
      await api.ativarProduto(+t.dataset.prodAtivo, t.checked);
      toast(t.checked ? 'Produto disponível no cardápio' : 'Produto marcado como indisponível', 'ok'); await refresh();
    }
  } catch (err) { console.error(err); toast(traduz(err), 'err'); refresh(); }
});
document.addEventListener('dragenter', e => e.target.closest?.('.drop')?.classList.add('over'));
document.addEventListener('dragleave', e => e.target.closest?.('.drop')?.classList.remove('over'));
document.addEventListener('drop', e => e.target.closest?.('.drop')?.classList.remove('over'));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.mesaId) ACTS['close-drawer'](); });
document.addEventListener('pointermove', e => {
  const card = e.target.closest?.('.mesa');
  if (card) { const r = card.getBoundingClientRect(); card.style.setProperty('--x', `${e.clientX - r.left}px`); card.style.setProperty('--y', `${e.clientY - r.top}px`); }
  const art = $('.login-art');
  if (art) { const r = art.getBoundingClientRect(); art.style.setProperty('--mx', `${e.clientX - r.left}px`); art.style.setProperty('--my', `${e.clientY - r.top}px`); }
}, { passive: true });
document.addEventListener('pointerdown', unlockAudio, { once: true });

/* ---------- relógio e cronômetros ---------- */
function tick() {
  document.querySelectorAll('[data-since]').forEach(el => {
    const m = mins(el.dataset.since);
    (el.querySelector('em') || el).textContent = ago(el.dataset.since);
    if (el.dataset.max) { const a = +el.dataset.min, b = +el.dataset.max; el.classList.toggle('warn', m >= a && m < b); el.classList.toggle('late', m >= b); }
  });
  const c = $('#clock'); if (c) c.textContent = hora();
}
setInterval(tick, 15000);

/* ---------- toasts e som ---------- */
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast t-${type}`; el.innerHTML = `<span class="t-dot"></span><p>${h(msg)}</p>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, 4200);
}
let actx;
function unlockAudio() { try { actx ||= new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {} }
function chime(kind = 1) {
  if (!actx || !S.som) return;
  const notes = kind === 2 ? [784, 1046] : [660, 880], t0 = actx.currentTime;
  notes.forEach((f, i) => {
    const o = actx.createOscillator(), g = actx.createGain(), t = t0 + i * 0.14;
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.55);
  });
}
function traduz(e) {
  const m = e?.message || String(e);
  const map = {
    'Invalid login credentials': 'E-mail ou senha incorretos.',
    'Email not confirmed': 'Confirme seu e-mail antes de entrar.',
    'User already registered': 'Este e-mail já está cadastrado.',
    'Password should be at least': 'A senha precisa ter ao menos 6 caracteres.',
    'Failed to fetch': 'Sem conexão com o servidor. Verifique sua internet.',
    'New password should be different': 'A nova senha precisa ser diferente da atual.',
    'Bucket not found': 'Armazenamento de fotos não configurado: rode o schema.sql atualizado no Supabase.',
    'exceeded the maximum allowed size': 'Imagem muito grande.',
    'mime type': 'Formato de imagem não suportado. Use JPG, PNG ou WebP.',
    'row-level security': 'Você não tem permissão para esta ação.',
    'rate limit': 'Muitas tentativas seguidas. Aguarde alguns minutos.',
    'same email': 'Este já é o seu e-mail atual.',
  };
  for (const k in map) if (m.includes(k)) return map[k];
  if (/provider is not enabled|Unsupported provider/i.test(m)) return 'O login com Google ainda não foi ativado no Supabase.';
  if (/column .* does not exist|Could not find the .* column|function .* does not exist/i.test(m)) return 'O banco está desatualizado: rode o schema.sql novo no SQL Editor do Supabase.';
  return m;
}

/* ---------- start ---------- */
api.onAuth(s => setSession(s));
setSession(await api.session());
</script>
